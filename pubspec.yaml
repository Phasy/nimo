name: nomi
description: "Give every kwacha a job."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2

  drift: 2.28.2
  drift_flutter: 0.2.7

  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

  drift_dev: 2.28.3
  build_runner: ^2.4.15

flutter:
  uses-material-design: true
  assets:
    - assets/branding/


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/nomi_app_image.png"
  min_sdk_android: 21

